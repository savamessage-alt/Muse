<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="50%" stop-color="#ff5533"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffeedd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Фон с градиентом -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Тонкий светлый обвод для объёма -->
  <rect width="508" height="508" x="2" y="2" rx="98" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Основной символ: нота в форме сердца/волны -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Основа ноты (овал) -->
    <ellipse cx="0" cy="40" rx="38" ry="28" fill="url(#noteGrad)" transform="rotate(-15)"/>
    <ellipse cx="0" cy="40" rx="34" ry="24" fill="#ff3333" transform="rotate(-15)"/>
    <ellipse cx="0" cy="40" rx="28" ry="18" fill="url(#noteGrad)" transform="rotate(-15)"/>
    
    <!-- Ствол ноты -->
    <rect x="28" y="-80" width="10" height="130" rx="5" fill="url(#noteGrad)" transform="rotate(-15)"/>
    <rect x="30" y="-78" width="6" height="126" rx="3" fill="#ff3333" transform="rotate(-15)"/>
    
    <!-- Флажок/волна (символ звука) -->
    <path d="M38 -60 Q70 -80 70 -30 Q70 10 38 0" fill="none" stroke="url(#noteGrad)" stroke-width="10" stroke-linecap="round" transform="rotate(-15)"/>
    <path d="M38 -60 Q70 -80 70 -30 Q70 10 38 0" fill="none" stroke="#ff3333" stroke-width="6" stroke-linecap="round" transform="rotate(-15)"/>
    <path d="M38 -60 Q70 -80 70 -30 Q70 10 38 0" fill="none" stroke="url(#noteGrad)" stroke-width="3" stroke-linecap="round" transform="rotate(-15)" opacity="0.8"/>
    
    <!-- Вторая волна для объёма -->
    <path d="M38 -20 Q65 -40 65 10 Q65 50 38 40" fill="none" stroke="url(#noteGrad)" stroke-width="8" stroke-linecap="round" transform="rotate(-15)" opacity="0.6"/>
    <path d="M38 -20 Q65 -40 65 10 Q65 50 38 40" fill="none" stroke="#ff3333" stroke-width="4" stroke-linecap="round" transform="rotate(-15)" opacity="0.5"/>
  </g>
  
  <!-- Легкий блик сверху для стеклянного эффекта -->
  <ellipse cx="256" cy="180" rx="120" ry="60" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Тонкая рефлексия снизу -->
  <ellipse cx="256" cy="380" rx="80" ry="20" fill="rgba(0,0,0,0.1)"/>
</svg>